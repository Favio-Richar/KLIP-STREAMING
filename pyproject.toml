[project]
name = "klick-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "pre-commit>=4", "pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "klick", "httpx>=0.27", "asyncpg-stubs>=0.30"]

[tool.uv]
package = false


[tool.uv.sources]
klick = { workspace = true }

[tool.uv.workspace]
members = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]  # el formateador acota el código; las cadenas largas son aceptables

[tool.ruff.lint.per-file-ignores]
"scripts/gen-progress.py" = ["E501", "E701", "E702", "E741"]
"services/api/alembic/**" = ["E501", "S608", "S105"]
"**/tests/**" = ["S101", "S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["db: requiere PostgreSQL (pnpm infra:up)"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["services/api/src", "services/api/tests", "services/api/alembic"]
exclude = ["services/api/alembic/versions/"]
mypy_path = ["services/api/src", "services/api/tests"]
explicit_package_bases = true
