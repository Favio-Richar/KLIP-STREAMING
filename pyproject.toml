[project]
name = "klick-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "pre-commit>=4"]

[tool.uv]
package = false


[tool.uv.workspace]
members = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/gen-progress.py" = ["E501", "E701", "E702", "E741"]
