[project]
name = "klick-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "klick",
    "httpx>=0.27",
    "asyncpg-stubs>=0.30",
    "boto3-stubs[s3]>=1.35",
    "pip-audit>=2.10.1",
    "datamodel-code-generator>=0.101.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false


[tool.uv.sources]
klick = { workspace = true }

[tool.uv.workspace]
members = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]  # el formateador acota el código; las cadenas largas son aceptables

[tool.ruff.lint.per-file-ignores]
"scripts/gen-progress.py" = ["E501", "E701", "E702", "E741"]
"services/api/alembic/**" = ["E501", "S608", "S105"]
"**/tests/**" = ["S101", "S105", "S106", "S608", "E501", "ASYNC240"]
# Las pruebas de imagen invocan `docker` (herramienta fija, argumentos propios, sin entrada externa).
"tests/media/**" = ["S603", "S607"]
"services/api/tests/test_render_ffmpeg.py" = ["S603", "S607"]
# Modelos generados desde el JSON Schema (packages/video-project-schema): su formato lo fija el generador.
"services/api/src/klick/edit_project/models.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "tests/security", "tests/media"]
pythonpath = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
  "db: requiere PostgreSQL (pnpm infra:up)",
  "docker: construye y ejecuta imágenes con Docker",
  "ffmpeg: usa los binarios reales de FFmpeg (corren en la imagen worker-media: pnpm test:media)",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["services/api/src", "services/api/tests", "services/api/alembic", "tests/security"]
exclude = ['services/api/alembic/versions/', '(^|/)conftest\.py$']
mypy_path = ["services/api/src", "services/api/tests", "tests/security"]
explicit_package_bases = true
