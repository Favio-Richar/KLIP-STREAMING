name: klick

x-healthy-defaults: &hc
  interval: 5s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klick_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klick_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-klick}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - klick_pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7.4-alpine
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - klick_redisdata:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["core"]
    environment:
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-klick}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-klick_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-klick_minio_secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - klick_miniodata:/bitnami/minio/data
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    profiles: ["core"]
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    ports:
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935"
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "${MEDIAMTX_API_PORT:-9997}:9997"
    healthcheck:
      <<: *hc
      test: ["CMD", "/mediamtx", "--version"]

volumes:
  klick_pgdata:
  klick_redisdata:
  klick_miniodata:
