name: klick

x-healthy-defaults: &hc
  interval: 5s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klick_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klick_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-klick}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - klick_pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7.4-alpine
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - klick_redisdata:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["core"]
    environment:
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-klick}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-klick_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-klick_minio_secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - klick_miniodata:/bitnami/minio/data
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    profiles: ["core"]
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    ports:
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935"
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "${MEDIAMTX_API_PORT:-9997}:9997"
    healthcheck:
      <<: *hc
      test: ["CMD", "/mediamtx", "--version"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_TARGET: ${OBS_API_TARGET:-host.docker.internal:8000}
    volumes:
      - ./infra/observability/prometheus.tmpl.yml:/etc/prometheus/prometheus.tmpl.yml:ro
      - klick_promdata:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__API_TARGET__|$${API_TARGET}|" /etc/prometheus/prometheus.tmpl.yml > /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-klick_grafana_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - klick_grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]

volumes:
  klick_pgdata:
  klick_redisdata:
  klick_miniodata:
  klick_promdata:
  klick_grafanadata:
