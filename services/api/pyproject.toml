[project]
name = "klick"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "uuid-utils>=0.10",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "redis>=5.2",
  "email-validator>=2.2",
  "cryptography>=43",
  "pyotp>=2.9",
  "httpx>=0.27",
  "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klick"]
